<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width">
    <title>Anthology – Minecraft Maps by Joey Sweener</title>
    
    <link rel="shortcut icon" type="image/png" href="./assets/favicon.svg">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css" type="text/css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css" type="text/css">
    
    <link href="styles/normalize.css" rel="stylesheet">
    <link href="styles/skeleton.css" rel="stylesheet">
    <link href="styles/theme.css" rel="stylesheet">

    <link href="styles/embers.css" rel="stylesheet">
  </head>
  <body>
    <main>
      <section class="block navigation overlay">
        <div class="embers"></div>
        <div class="container center">
          <h1 class="center" aria-label="Anthology CTM">
            <img src="./assets/Anthology_Logo_Red.svg" alt="Logo for Anthology CTM" class="logo">
          </h1>
          <div class="grid">
            <a class="tarot span-all lg-span-third" href="one.html" id="one">
              <div class="tarot-inner">
                <i class="ph-light ph-wall"></i>
                <hgroup class="title">
                  <p class="eyebrow">Chapter I</p>
                  <hr>
                  <h2>Prisoner</h2>
                </hgroup>
                <p class="description">Trapped at the<br>Edge of Oblivion</p>
              </div>
              <img src="./assets/ch-i-splash.jpg" alt="Splash image for Anthology, Chapter One: Prisoner" class="wallpaper hover">
            </a>
            <a class="tarot span-all lg-span-third" href="two.html" style="display: none;">
              <div class="tarot-inner">
                <i class="ph-light ph-moon-stars"></i>
                <hgroup class="title">
                  <p class="eyebrow">Chapter II</p>
                  <hr>
                  <h2>Oracle</h2>
                </hgroup>
                <p class="description">Channel the<br>Outer Spheres</p>
              </div>
              <img src="./assets/ch-ii-splash.jpg" alt="Splash image for Anthology, Chapter Two: Oracle" class="wallpaper hover">
            </a>
            <a class="tarot span-all lg-span-third" href="three.html" style="display: none;">
              <div class="tarot-inner">
                <i class="ph-light ph-compass-rose"></i>
                <hgroup class="title">
                  <p class="eyebrow">Chapter III</p>
                  <hr>
                  <h2>Luminary</h2>
                </hgroup>
                <p class="description">Bring Light to<br>the Darkness</p>
              </div>
              <img src="./assets/ch-iii-splash.jpg" alt="Splash image for Anthology, Chapter Three: Luminary" class="wallpaper hover">
            </a>
          </div>
          <img src="./assets/anthology-hero.jpg" alt="Minecraft screenshot." class="wallpaper">
          <p><a href="about.html" class="center btn-text" style="margin-top: var(--spacing-400);">What is Anthology?</a></p>
        </div>
      </section>
    </main>
    <footer class="block">
      <div class="container center">
        <p>Anthology is a collection of Minecraft maps created by <a href="https://sweenerjoey.github.io/">Joey Sweener</a>. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
<script src="./styles/embers.js"></script>
